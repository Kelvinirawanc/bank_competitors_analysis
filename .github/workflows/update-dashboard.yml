name: Update Banking & Fintech Dashboard

on:
  schedule:
    # Daily at 07:00 WIB (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "banking-fintech-dashboard"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Google Play review and store-metadata scraper
        run: |
          python scraper/scrape_reviews.py --max-reviews-per-stream 200

      - name: Validate generated JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path("data/apps_catalog.json"),
              Path("data/app_registry.json"),
              Path("data/reviews.json"),
              Path("data/summary.json"),
              Path("data/store_history.json"),
              Path("data/collection_diagnostics.json"),
          ]:
              if not path.exists():
                  raise SystemExit(f"Missing generated file: {path}")
              json.loads(path.read_text(encoding="utf-8"))
              print(f"Valid JSON: {path}")
          reviews = json.loads(Path("data/reviews.json").read_text(encoding="utf-8"))["reviews"]
          bad = [r for r in reviews if r.get("platform") != "Google Play"]
          if bad:
              raise SystemExit(f"Found {len(bad)} non-Google-Play review rows")
          print(f"Google Play review rows stored: {len(reviews)}")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apps_catalog.json data/app_registry.json data/reviews.json data/reviews.csv data/summary.json data/store_history.json data/collection_diagnostics.json
          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Auto update Google Play competitor data"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
